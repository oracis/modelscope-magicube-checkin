description: 自动领取魔搭（ModelScope）每日发放的魔粒（Magicube）算力额度。走 Chrome DevTools Protocol 真点页面「领取」按钮，以余额变化作为唯一成功判据，不调逆向接口、不依赖「登录即到账」的假设。含一次性人工登录（登录态存独立 Chrome profile，之后每天无头复用）、四态判据机、故障处置表与 9 项自测脚本。覆盖 Chrome 136+ 独立 profile 限制、App-Bound cookie 不可解、两个领取按钮需连点、按钮误选等全部踩坑点。
